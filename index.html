<!doctype html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ગુજરાતી વોઇસ ટાઇપિંગ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0A2342;
    --navy-950: #071A33;
    --gold-500: #C6A15B;
    --gold-600: #AD8A44;
    --gold-100: #F4EBD8;
    --paper: #FDFCF9;
    --desk: #EEF1F6;
    --ink: #1E2530;
    --muted: #5B6472;
    --border: #D9DFE8;
    --danger: #B3261E;
    --radius: 4px;
    --font-guj: 'Noto Sans Gujarati', 'Noto Sans', system-ui, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12212F;
      --desk: #0A1622;
      --ink: #EDEFF3;
      --muted: #9AA6B4;
      --border: #2A3B4D;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12212F;
    --desk: #0A1622;
    --ink: #EDEFF3;
    --muted: #9AA6B4;
    --border: #2A3B4D;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-guj);
    background: var(--desk);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
    color: #fff;
    padding: 18px 20px calc(16px + env(safe-area-inset-top, 0px));
    border-bottom: 3px solid var(--gold-500);
    text-align: center;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }

  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .mic-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--navy-900);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 16px 32px;
    font-size: 18px;
    font-family: var(--font-guj);
    font-weight: 600;
    cursor: pointer;
  }
  .mic-btn.recording { background: var(--danger); }
  .btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 15px;
    font-family: var(--font-guj);
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--gold-600); }

  .status {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy-900);
    min-height: 20px;
  }
  :root[data-theme="dark"] .status, body.dark-auto .status { color: var(--gold-100); }
  .status .dot {
    display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    margin-right: 6px;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #editor {
    flex: 1;
    min-height: 55vh;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    font-size: 19px;
    line-height: 2;
    outline: none;
    overflow-y: auto;
  }
  #editor:empty:before {
    content: attr(data-placeholder);
    color: var(--muted);
  }

  .footer-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>ગુજરાતી વોઇસ ટાઇપિંગ</h1>
</header>

<main>
  <div class="controls">
    <button id="micBtn" class="mic-btn">🎤 <span id="micLabel">બોલવાનું શરૂ કરો</span></button>
    <button id="clearBtn" class="btn">સાફ કરો</button>
  </div>

  <div class="status" id="statusText"></div>

  <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="અહીં બોલેલું લખાણ દેખાશે... તમે તેને જાતે પણ ટાઇપ/એડિટ કરી શકો છો."></div>

  <div class="footer-actions">
    <button id="copyBtn" class="btn">📋 કૉપિ કરો</button>
  </div>

  <p class="hint">માઇક્રોફોનની પરવાનગી જરૂરી છે. શ્રેષ્ઠ પરિણામ માટે Chrome બ્રાઉઝરનો ઉપયોગ કરો.</p>
</main>

<script>
(function () {
  "use strict";

  var editor = document.getElementById('editor');
  var micBtn = document.getElementById('micBtn');
  var micLabel = document.getElementById('micLabel');
  var statusText = document.getElementById('statusText');
  var isRecording = false;

  function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function insertAtCursor(text) {
    editor.focus();
    var sel = window.getSelection();
    var node = document.createTextNode(text);
    if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
      var range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      editor.appendChild(node);
    }
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (editor.textContent.trim() && !confirm('શું તમે લખાણ સાફ કરવા માંગો છો?')) return;
    editor.innerHTML = '';
    editor.focus();
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    navigator.clipboard.writeText(editor.innerText).then(function () {
      flash('કૉપિ થયું ✅');
    }).catch(function () {
      var range = document.createRange();
      range.selectNode(editor);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      flash('કૉપિ થયું ✅');
    });
  });

  function flash(msg) {
    statusText.textContent = msg;
    setTimeout(function () { if (!isRecording) statusText.textContent = ''; }, 1800);
  }

  var SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;

  if (SpeechRecognitionImpl) {
    recognition = new SpeechRecognitionImpl();
    recognition.lang = 'gu-IN';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = function (event) {
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var result = event.results[i];
        if (result.isFinal) {
          insertAtCursor(result[0].transcript.trim() + ' ');
        }
      }
    };

    recognition.onerror = function (event) {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        alert('માઇક્રોફોનની પરવાનગી નકારવામાં આવી. કૃપા કરી બ્રાઉઝર સેટિંગ્સમાં માઇક્રોફોન મંજૂર કરો.');
      }
      stopRecording();
    };

    recognition.onend = function () {
      if (isRecording) {
        try { recognition.start(); } catch (e) { stopRecording(); }
      }
    };
  } else {
    micBtn.disabled = true;
    micLabel.textContent = 'આ બ્રાઉઝરમાં અવાજ ઓળખ ઉપલબ્ધ નથી';
  }

  function startRecording() {
    if (!recognition) return;
    try {
      recognition.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micLabel.textContent = 'બંધ કરો';
      statusText.innerHTML = '<span class="dot"></span>સાંભળી રહ્યું છે...';
    } catch (e) { /* already started */ }
  }

  function stopRecording() {
    isRecording = false;
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    micBtn.classList.remove('recording');
    micLabel.textContent = 'બોલવાનું શરૂ કરો';
    statusText.textContent = '';
  }

  micBtn.addEventListener('click', function () {
    if (isRecording) { stopRecording(); } else { startRecording(); }
  });

})();
</script>

</body>
</html>
